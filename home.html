<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - NakHeng Electronic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-surface: #131a26;
            --accent: #00f0ff;
            --text-primary: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient subtle grid pattern back-layer */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.4;
            z-index: 1;
        }

        .welcome-container {
            text-align: center;
            background: var(--bg-surface);
            padding: 60px 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            position: relative;
            z-index: 10;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-top {
            font-size: 50px;
            color: var(--accent);
            margin-bottom: 24px;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            display: inline-block;
        }

        .welcome-title {
            font-size: 40px;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome-title .highlight {
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .welcome-message {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .feature-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .feature-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .feature-badge i {
            color: var(--accent);
        }

        .feature-badge:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .welcome-title { font-size: 32px; }
            .welcome-container { padding: 40px 20px; }
            .feature-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="welcome-container">
        <div class="icon-top">
            <i class="fas fa-charging-station"></i>
        </div>
        
        <h1 class="welcome-title">
            Welcome to <span class="highlight">NakHeng</span>
        </h1>
        
        <p class="welcome-subtitle">
            <i class="fas fa-bolt text-accent"></i> 
            Electronic Learning Workspace
            <i class="fas fa-lightbulb text-accent"></i>
        </p>
        
        <p class="welcome-message">
            Select an operational category from the menu navigation above to deploy circuit data, explore hardware architecture pins, or track custom telemetry script projects.
        </p>


    </div>

</body>
</html>
