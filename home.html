<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - NakHeng Electronic</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f4f6fa;
            --bg-surface: #ffffff;
            --accent: #0066ff;
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient subtle grid pattern back-layer */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.6;
            z-index: 1;
        }

        /* Light Theme Dynamic Action Button */
        .btn-dark-blue.glow {
            background-color: #ffffff;
            color: var(--accent);
            border: 2px solid var(--border-color);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 102, 255, 0.05);
        }

        /* Hover Effect */
        .btn-dark-blue.glow:hover {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Click Effect */
        .btn-dark-blue.glow:active {
            transform: translateY(1px);
        }

        .welcome-container {
            text-align: center;
            background: var(--bg-surface);
            padding: 60px 40px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(15, 23, 42, 0.04);
            max-width: 600px;
            position: relative;
            z-index: 10;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-top {
            font-size: 50px;
            color: var(--accent);
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 10px rgba(0, 102, 255, 0.15));
            display: inline-block;
        }

        .welcome-title {
            font-size: 40px;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .welcome-title .highlight {
            color: var(--accent);
        }

        .welcome-subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .welcome-message {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .feature-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .feature-badge {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.25s ease;
        }

        .feature-badge i {
            color: var(--accent);
        }

        .feature-badge:hover {
            background: rgba(0, 102, 255, 0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .welcome-title { font-size: 32px; }
            .welcome-container { padding: 40px 20px; }
            .feature-row { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <div class="welcome-container">
        <div class="icon-top">
            <i class="fas fa-charging-station"></i>
        </div>
        
        <h1 class="welcome-title">
            Welcome to <span class="highlight">NakHeng</span>
        </h1>
        
        <p class="welcome-subtitle">
            <i class="fas fa-bolt text-accent"></i> 
            Electronic Learning Workspace
            <i class="fas fa-lightbulb text-accent"></i>
        </p>
        
        <p class="welcome-message">
            <button class="btn-dark-blue glow">Random</button>
        </p>
    </div>

</body>
</html>
